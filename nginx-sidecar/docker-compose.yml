version: "3.7"

services:
  nginx-sidecar:
    build: .
    image: pennsieve/nginx-sidecar:${IMAGE_TAG}

  nginx-sidecar-test:
    build: .
    ports:
      - "8443:8443"
    environment:
      LISTEN_PORT: 8443
      SERVICE_NAME: service
      SERVICE_PORT: 8080
      PARAMS: $$CERTIFICATE_NAME:$$CERTIFICATE_KEY_NAME:$$LISTEN_PORT:$$SERVICE_NAME:$$SERVICE_PORT
    depends_on:
      - service

  service:
    build: ./test
    command: python /app/app.py
